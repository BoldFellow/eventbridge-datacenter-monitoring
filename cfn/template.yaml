AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EventBridge Datacenter Monitoring Telemetry  -  sensors publish temperature, motion,
  and energy events to a custom bus; four rules with progressively richer patterns
  route events to Lambda, SNS, SQS, and DynamoDB. Includes CloudWatch Alarm and
  Dashboard for end-to-end visibility.

Parameters:
  AlertEmailAddress:
    Type: String
    Description: Infrastructure team email address  -  receives temperature alerts only.

  SecurityEmailAddress:
    Type: String
    Description: Security team email address  -  receives restricted-zone queue-depth alarm notifications.

  ManagerEmailAddress:
    Type: String
    Description: Manager email address  -  receives the daily datacenter summary digest.

# -- Storage --------------------------------------------------------------------

Resources:

  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dc-readings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  AnomaliesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dc-anomalies
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: anomalyId
          AttributeType: S
      KeySchema:
        - AttributeName: anomalyId
          KeyType: HASH

# -- Messaging ------------------------------------------------------------------

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dc-infra-team

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmailAddress

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic

  SecurityAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dc-sec-team

  SecurityAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SecurityAlertTopic
      Protocol: email
      Endpoint: !Ref SecurityEmailAddress

  SecurityAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SecurityAlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SecurityAlertTopic

  ManagerTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ManagerTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarmPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ManagerTopic

  ManagerTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dc-management

  ManagerSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ManagerTopic
      Protocol: email
      Endpoint: !Ref ManagerEmailAddress

  SecurityQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dc-security-review-queue
      MessageRetentionPeriod: 86400

  SecurityQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SecurityQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeSend
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SecurityQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/dc-telemetry-bus/dc-restricted-motion"

# -- EventBridge ----------------------------------------------------------------

  TelemetryBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: dc-telemetry-bus

# -- IAM roles ------------------------------------------------------------------

  SimulatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dc-simulator-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PutTelemetryEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !GetAtt TelemetryBus.Arn

  RecorderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dc-recorder-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteReadings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt ReadingsTable.Arn

  AnomalyHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dc-anomaly-handler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteAnomalies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt AnomaliesTable.Arn

  DailySummaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dc-daily-summary-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SummaryPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:Scan
                Resource:
                  - !GetAtt ReadingsTable.Arn
                  - !GetAtt AnomaliesTable.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ManagerTopic

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dc-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeScheduledLambdas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt SimulatorFunction.Arn
                  - !GetAtt DailySummaryFunction.Arn

# -- Lambda functions -----------------------------------------------------------

  SimulatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dc-simulator
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt SimulatorRole.Arn
      Timeout: 30
      Environment:
        Variables:
          BUS_NAME: dc-telemetry-bus
      Code:
        ZipFile: |
          import json, random, boto3, os

          BUILDING = "HQ"
          ZONES = ["lobby","office-1","cafeteria","restricted-server-room","restricted-ceo-office"]
          BUS = os.environ["BUS_NAME"]
          events_client = boto3.client("events")

          def temp_event(zone):
              temp = random.randint(82, 95) if random.random() < 0.2 else random.randint(18, 75)
              return {"Source": "sensors.datacenter", "DetailType": "TemperatureReading",
                      "EventBusName": BUS, "Detail": json.dumps({
                          "sensorId": random.choice(["T-001","T-002"]), "building": BUILDING,
                          "zone": zone, "temperature": temp, "unit": "C"})}

          def motion_event(zone):
              return {"Source": "sensors.datacenter", "DetailType": "MotionDetected",
                      "EventBusName": BUS, "Detail": json.dumps({
                          "sensorId": random.choice(["M-003","M-004"]), "building": BUILDING,
                          "zone": zone, "confidence": random.randint(70, 100)})}

          def energy_event(zone):
              kwh = round(random.uniform(52,80),1) if random.random()<0.15 else round(random.uniform(5,45),1)
              return {"Source": "sensors.datacenter", "DetailType": "EnergyUsage",
                      "EventBusName": BUS, "Detail": json.dumps({
                          "sensorId": random.choice(["E-005","E-006"]), "building": BUILDING,
                          "zone": zone, "kwh": kwh, "period": "15min"})}

          MAKERS = [temp_event, motion_event, energy_event]

          def lambda_handler(event, context):
              zones = random.sample(ZONES, k=min(5, len(ZONES)))
              entries = [random.choice(MAKERS)(z) for z in zones]
              resp = events_client.put_events(Entries=entries)
              print(f"Published {len(entries)} events, failed={resp['FailedEntryCount']}")
              return {"published": len(entries), "failed": resp["FailedEntryCount"]}

  RecorderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dc-recorder
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt RecorderRole.Arn
      Environment:
        Variables:
          READINGS_TABLE: dc-readings
      Code:
        ZipFile: |
          import json, os, boto3

          dynamodb = boto3.resource("dynamodb")
          TABLE = os.environ["READINGS_TABLE"]

          def lambda_handler(event, context):
              table = dynamodb.Table(TABLE)
              table.put_item(Item={
                  "eventId": event["id"],
                  "eventType": event["detail-type"],
                  "sensorId": event["detail"].get("sensorId", ""),
                  "building": event["detail"].get("building", ""),
                  "zone": event["detail"].get("zone", ""),
                  "detail": json.dumps(event["detail"]),
                  "timestamp": event["time"],
              })
              print(f"Recorded {event['id']} type={event['detail-type']} zone={event['detail'].get('zone')}")
              return {"recorded": event["id"]}

  AnomalyHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dc-anomaly-handler
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt AnomalyHandlerRole.Arn
      Environment:
        Variables:
          ANOMALIES_TABLE: dc-anomalies
      Code:
        ZipFile: |
          import os, uuid, boto3
          from datetime import datetime, timezone

          dynamodb = boto3.resource("dynamodb")
          TABLE = os.environ["ANOMALIES_TABLE"]

          def lambda_handler(event, context):
              d = event["detail"]
              table = dynamodb.Table(TABLE)
              aid = str(uuid.uuid4())
              table.put_item(Item={
                  "anomalyId": aid,
                  "originalEventId": event["id"],
                  "sensorId": d.get("sensorId", ""),
                  "building": d.get("building", ""),
                  "zone": d.get("zone", ""),
                  "kwh": str(d.get("kwh", 0)),
                  "period": d.get("period", ""),
                  "detectedAt": datetime.now(timezone.utc).isoformat(),
                  "eventTimestamp": event["time"],
                  "status": "new",
              })
              print(f"Anomaly {aid}: zone={d.get('zone')}, kwh={d.get('kwh')}")
              return {"anomalyId": aid}

  DailySummaryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dc-daily-summary
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt DailySummaryRole.Arn
      Environment:
        Variables:
          READINGS_TABLE: dc-readings
          ANOMALIES_TABLE: dc-anomalies
          SNS_TOPIC_ARN: !Ref ManagerTopic
      Code:
        ZipFile: |
          import os, boto3
          from datetime import datetime, timezone, timedelta
          from collections import defaultdict
          from boto3.dynamodb.conditions import Attr

          dynamodb = boto3.resource("dynamodb")
          sns = boto3.client("sns")
          READINGS_TABLE = os.environ["READINGS_TABLE"]
          ANOMALIES_TABLE = os.environ["ANOMALIES_TABLE"]
          SNS_TOPIC_ARN = os.environ["SNS_TOPIC_ARN"]

          def lambda_handler(event, context):
              yesterday = (datetime.now(timezone.utc) - timedelta(days=1)).strftime("%Y-%m-%d")
              readings = dynamodb.Table(READINGS_TABLE).scan(
                  FilterExpression=Attr("timestamp").begins_with(yesterday)).get("Items", [])
              anomalies = dynamodb.Table(ANOMALIES_TABLE).scan(
                  FilterExpression=Attr("detectedAt").begins_with(yesterday)).get("Items", [])
              by_type = defaultdict(int)
              zones = set()
              for r in readings:
                  by_type[r.get("eventType", "Unknown")] += 1
                  zones.add(r.get("zone", ""))
              lines = [
                  f"Datacenter Daily Summary - {yesterday}",
                  "=" * 48,
                  f"Total readings : {len(readings)}",
                  f"Energy anomalies: {len(anomalies)}",
                  f"Active zones   : {len(zones)}",
                  "", "Events by type:",
              ] + [f"  {t}: {c}" for t, c in sorted(by_type.items())]
              if anomalies:
                  lines += ["", "Energy anomalies:"]
                  for a in anomalies[:10]:
                      lines.append(f"  {a.get('zone')}: {a.get('kwh')} kWh at {str(a.get('eventTimestamp',''))[:19]}")
              msg = "\n".join(lines)
              print(msg)
              sns.publish(TopicArn=SNS_TOPIC_ARN, Subject=f"Datacenter Daily Summary - {yesterday}", Message=msg)
              return {"date": yesterday, "events": len(readings), "anomalies": len(anomalies)}

# -- EventBridge rules ----------------------------------------------------------

  AllReadingsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dc-all-readings
      Description: Catch all sensor events and persist to DynamoDB
      EventBusName: !Ref TelemetryBus
      State: ENABLED
      EventPattern:
        source:
          - sensors.datacenter
      Targets:
        - Id: recorder-lambda
          Arn: !GetAtt RecorderFunction.Arn

  RecorderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt RecorderFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AllReadingsRule.Arn

  HighTempRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dc-high-temperature
      Description: Route temperature readings above 80C to SNS alert
      EventBusName: !Ref TelemetryBus
      State: ENABLED
      EventPattern:
        source:
          - sensors.datacenter
        detail-type:
          - TemperatureReading
        detail:
          temperature:
            - numeric:
                - ">"
                - 80
      Targets:
        - Id: sns-alert
          Arn: !Ref AlertTopic
          InputTransformer:
            InputPathsMap:
              zone: "$.detail.zone"
              temp: "$.detail.temperature"
              sensor: "$.detail.sensorId"
            InputTemplate: '"TEMPERATURE ALERT: <temp>C detected at <zone> by sensor <sensor>. Threshold is 80C."'

  RestrictedMotionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dc-restricted-motion
      Description: Route motion events in restricted zones to SQS security queue
      EventBusName: !Ref TelemetryBus
      State: ENABLED
      EventPattern:
        source:
          - sensors.datacenter
        detail-type:
          - MotionDetected
        detail:
          zone:
            - prefix: restricted-
      Targets:
        - Id: security-sns-alert
          Arn: !Ref SecurityAlertTopic
          InputTransformer:
            InputPathsMap:
              zone: "$.detail.zone"
              sensor: "$.detail.sensorId"
              confidence: "$.detail.confidence"
            InputTemplate: '"SECURITY ALERT: Motion detected in <zone> by sensor <sensor> (confidence <confidence>%). Immediate review required."'
        - Id: security-queue
          Arn: !GetAtt SecurityQueue.Arn

  EnergySpikeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dc-energy-spike
      Description: Route energy usage above 50 kWh to anomaly handler Lambda
      EventBusName: !Ref TelemetryBus
      State: ENABLED
      EventPattern:
        source:
          - sensors.datacenter
        detail-type:
          - EnergyUsage
        detail:
          kwh:
            - numeric:
                - ">"
                - 50
      Targets:
        - Id: anomaly-handler
          Arn: !GetAtt AnomalyHandlerFunction.Arn

  AnomalyPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AnomalyHandlerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EnergySpikeRule.Arn

# -- EventBridge Scheduler ------------------------------------------------------

  SimulatorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dc-simulator-schedule
      GroupName: default
      ScheduleExpression: rate(2 minutes)
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt SimulatorFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 1
          MaximumEventAgeInSeconds: 60

  DailySummarySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: dc-daily-summary-schedule
      GroupName: default
      ScheduleExpression: "cron(0 9 * * ? *)"
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: FLEXIBLE
        MaximumWindowInMinutes: 15
      Target:
        Arn: !GetAtt DailySummaryFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 1
          MaximumEventAgeInSeconds: 3600

# -- CloudWatch Alarm -----------------------------------------------------------

  SecurityReviewAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dc-security-review-pending
      AlarmDescription: Security review queue has unprocessed messages  -  human action required
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SecurityQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 5
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ManagerTopic
      OKActions:
        - !Ref ManagerTopic

# -- CloudWatch Dashboard -------------------------------------------------------

  DatacenterMonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: eventbridge-datacenter-monitoring
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# Datacenter Monitoring Telemetry\nEvents flow: **Simulator -> dc-telemetry-bus -> Rules -> Lambda / SNS / SQS**. Rule invocations climb every 2 minutes as the simulator fires. Alarm goes IN_ALARM when messages sit in the security review queue."
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 24, "height": 6,
              "properties": {
                "title": "EventBridge Rule Invocations (events matched per minute)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 60,
                "annotations": {"horizontal": []},
                "metrics": [
                  ["AWS/Events","Invocations","RuleName","dc-all-readings",     "EventBusName","dc-telemetry-bus",{"label":"All readings (catch-all)","color":"#1f77b4"}],
                  ["AWS/Events","Invocations","RuleName","dc-high-temperature", "EventBusName","dc-telemetry-bus",{"label":"High temperature (>80C)","color":"#d62728"}],
                  ["AWS/Events","Invocations","RuleName","dc-restricted-motion","EventBusName","dc-telemetry-bus",{"label":"Restricted zone motion","color":"#ff7f0e"}],
                  ["AWS/Events","Invocations","RuleName","dc-energy-spike",     "EventBusName","dc-telemetry-bus",{"label":"Energy spike (>50 kWh)","color":"#9467bd"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 60,
                "annotations": {"horizontal": []},
                "metrics": [
                  ["AWS/Lambda","Invocations","FunctionName","dc-simulator",      {"label":"simulator","color":"#1f77b4"}],
                  ["AWS/Lambda","Invocations","FunctionName","dc-recorder",       {"label":"recorder","color":"#2ca02c"}],
                  ["AWS/Lambda","Invocations","FunctionName","dc-anomaly-handler",{"label":"anomaly-handler","color":"#9467bd"}],
                  ["AWS/Lambda","Invocations","FunctionName","dc-daily-summary",  {"label":"daily-summary","color":"#8c564b"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors (should stay at 0)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 60,
                "annotations": {"horizontal": [{"label":"Any error is a problem","value":1,"color":"#d62728"}]},
                "metrics": [
                  ["AWS/Lambda","Errors","FunctionName","dc-simulator",      {"label":"simulator errors","color":"#d62728"}],
                  ["AWS/Lambda","Errors","FunctionName","dc-recorder",       {"label":"recorder errors","color":"#ff7f0e"}],
                  ["AWS/Lambda","Errors","FunctionName","dc-anomaly-handler",{"label":"anomaly-handler errors","color":"#9467bd"}],
                  ["AWS/Lambda","Errors","FunctionName","dc-daily-summary",  {"label":"daily-summary errors","color":"#8c564b"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB Writes",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 60,
                "annotations": {"horizontal": []},
                "metrics": [
                  ["AWS/DynamoDB","ConsumedWriteCapacityUnits","TableName","dc-readings", {"label":"dc-readings (all events)","color":"#1f77b4"}],
                  ["AWS/DynamoDB","ConsumedWriteCapacityUnits","TableName","dc-anomalies",{"label":"dc-anomalies (energy spikes)","color":"#9467bd"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 14, "width": 8, "height": 6,
              "properties": {
                "title": "Security Review Queue - Messages Pending",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Maximum", "period": 60,
                "annotations": {"horizontal": [{"label":"Alarm threshold","value":5,"color":"#d62728"}]},
                "metrics": [
                  ["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","dc-security-review-queue",{"label":"Messages waiting for review","color":"#ff7f0e"}]
                ]
              }
            },
            {
              "type": "alarm",
              "x": 20, "y": 14, "width": 4, "height": 6,
              "properties": {
                "title": "Security Review Alarm",
                "alarms": ["arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:dc-security-review-pending"]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 20, "width": 24, "height": 4,
              "properties": {
                "title": "SNS Messages Published to dc-infra-team (temperature alerts only)",
                "view": "timeSeries", "stacked": false,
                "region": "${AWS::Region}",
                "stat": "Sum", "period": 60,
                "annotations": {"horizontal": []},
                "metrics": [
                  ["AWS/SNS","NumberOfMessagesPublished","TopicName","dc-infra-team",{"label":"dc-infra-team","color":"#d62728"}]
                ]
              }
            }
          ]
        }

# -- Outputs --------------------------------------------------------------------

Outputs:

  TelemetryBusArn:
    Description: Custom EventBridge bus ARN
    Value: !GetAtt TelemetryBus.Arn

  AlertTopicArn:
    Description: SNS topic ARN for infrastructure temperature alerts (dc-infra-team)
    Value: !Ref AlertTopic

  SecurityAlertTopicArn:
    Description: SNS topic ARN for security team alarm notifications (dc-sec-team)
    Value: !Ref SecurityAlertTopic

  ManagerTopicArn:
    Description: SNS topic ARN for manager daily summary digest (dc-management)
    Value: !Ref ManagerTopic

  SecurityQueueUrl:
    Description: SQS queue URL for security review
    Value: !Ref SecurityQueue

  ReadingsTableName:
    Description: DynamoDB table for all sensor readings
    Value: !Ref ReadingsTable

  AnomaliesTableName:
    Description: DynamoDB table for energy anomalies
    Value: !Ref AnomaliesTable

  DashboardUrl:
    Description: CloudWatch dashboard URL
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=eventbridge-datacenter-monitoring"
